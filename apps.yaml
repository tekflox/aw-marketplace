# aw-marketplace catalog
#
# Loaded by aw-workspace when the user clicks "Marketplace" in the Apps view.
# Each entry summarizes one installable app; the authoritative manifest
# (aw-app.json, per the Decoupled Apps Framework ADR) lives in the app's own
# repo at `repo` — this file is the browse/install index, not a duplicate of
# the manifest. See SCHEMA.md for the full field reference.

version: 1

apps:
  - id: git
    name: Git + GitHub CLI
    description: >-
      Installs git and the GitHub CLI (gh) into the workspace and provides a
      settings panel for gh login (token or web flow — the token is stored in
      the zero-knowledge secret store, never in plain config).
    repo: tekflox/aw-app-git
    ref: main
    icon: git-branch
    category: dev-tools
    tags: [git, github, cli]
    has_config: true
    bootstrap: true

  - id: essentials
    name: Essential CLI Tools
    description: >-
      Installs a set of essential CLI tools into the workspace — telnet,
      ping, curl, nc, perl, python — and keeps them present across restarts.
      No login/settings/secrets, pure command install.
    repo: tekflox/aw-app-essentials
    ref: main
    icon: terminal
    category: dev-tools
    tags: [cli, networking, essentials]
    has_config: false
    bootstrap: true
