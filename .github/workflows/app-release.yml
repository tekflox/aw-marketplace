name: App release (reusable)

# Called by a ~10-line caller workflow in each aw-app-* repo via:
#   jobs:
#     release:
#       uses: tekflox/aw-marketplace/.github/workflows/app-release.yml@v1
#       secrets: inherit
#
# Referenced by a MOVING tag (@v1) or @main so bumping this workflow
# propagates to every caller's next run without touching their repos.
on:
  workflow_call:
    inputs:
      bump:
        description: "Force a bump kind (only 'major' is meaningful here)."
        type: string
        required: false
        default: ""
    secrets:
      MARKETPLACE_SYNC_TOKEN:
        description: "PAT (repo scope) used to push/PR into tekflox/aw-marketplace."
        required: true

jobs:
  release:
    if: ${{ !contains(github.event.head_commit.message, '[skip release]') }}
    runs-on: [self-hosted, aw-baremetal]
    permissions:
      contents: write
    steps:
      - name: Checkout app repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.MARKETPLACE_SYNC_TOKEN }}

      - name: Checkout aw-marketplace scripts + catalog
        uses: actions/checkout@v4
        with:
          repository: tekflox/aw-marketplace
          path: _marketplace
          token: ${{ secrets.MARKETPLACE_SYNC_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run app tests (must pass before any bump/tag/marketplace sync)
        run: |
          set -euo pipefail
          # Common baseline every aw-app-* repo's test suite needs (manifest
          # validation + FastAPI TestClient-based route tests) — apps that
          # need more (e.g. a real playwright browser) lazy-import it inside
          # the function under test, not at module scope, so it's fine for
          # those tests to stay mocked/unexercised here without the extra dep.
          pip install -q pytest jsonschema fastapi httpx uvicorn
          if [ -f tests/validate_manifest.py ]; then
            python3 tests/validate_manifest.py
          fi
          if compgen -G "tests/test_*.py" > /dev/null; then
            python3 -m pytest tests/ -q
          fi

      - name: Determine bump kind + new version
        id: bump
        env:
          MANUAL_BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          CURRENT_VERSION=$(python3 -c "import json;print(json.load(open('aw-app.json'))['version'])")
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$LAST_TAG" ]; then
            git log "${LAST_TAG}..HEAD" --format=%s > /tmp/commit_subjects.txt
          else
            git log --format=%s > /tmp/commit_subjects.txt
          fi

          MANUAL_FLAG=""
          if [ "$MANUAL_BUMP" = "major" ] || grep -qi '\[major\]' /tmp/commit_subjects.txt; then
            MANUAL_FLAG="--manual-bump major"
          fi

          NEW_VERSION=$(python3 _marketplace/scripts/bump_version.py "$CURRENT_VERSION" \
            --commit-subjects-file /tmp/commit_subjects.txt $MANUAL_FLAG)
          echo "current_version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "new_tag=v$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Bump aw-app.json, tag, and push release branch
        id: release
        env:
          NEW_VERSION: ${{ steps.bump.outputs.new_version }}
          NEW_TAG: ${{ steps.bump.outputs.new_tag }}
        run: |
          set -euo pipefail
          python3 -c "
          import json
          p = 'aw-app.json'
          data = json.load(open(p))
          data['version'] = '$NEW_VERSION'
          json.dump(data, open(p, 'w'), indent=2)
          open(p, 'a').write('\n')
          "
          git config user.name "aw-marketplace-sync[bot]"
          git config user.email "aw-marketplace-sync@tekflox.com"
          git add aw-app.json
          git commit -m "chore(release): bump to $NEW_TAG [skip release]"
          git tag "$NEW_TAG"
          git branch "release/$NEW_TAG"
          git push origin HEAD:"${GITHUB_REF_NAME}"
          git push origin "$NEW_TAG"
          git push origin "release/$NEW_TAG"

      - name: Sync marketplace catalog entry
        id: sync
        env:
          GH_TOKEN: ${{ secrets.MARKETPLACE_SYNC_TOKEN }}
          NEW_TAG: ${{ steps.bump.outputs.new_tag }}
          APP_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cd _marketplace
          APP_ID=$(python3 -c "import json;print(json.load(open('../aw-app.json'))['id'])")
          BRANCH="sync/${APP_ID}"

          git config user.name "aw-marketplace-sync[bot]"
          git config user.email "aw-marketplace-sync@tekflox.com"

          # Idempotent PR, clean branch history: always rebuild the sync branch
          # from current master. Reusing squash-merged sync branches preserves
          # old commits in the PR commit list even when the diff is clean.
          git fetch origin master
          git checkout -B "$BRANCH" origin/master

          set +e
          python3 scripts/sync_catalog_entry.py ../aw-app.json apps.json "$NEW_TAG" --write
          CHANGED=$?
          set -e

          if [ "$CHANGED" -ne 0 ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

          git add apps.json
          git commit -m "chore(sync): ${APP_ID} -> ${NEW_TAG}"
          git push -u origin "$BRANCH" --force-with-lease
          export APP_ID BRANCH

          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          token = os.environ["GH_TOKEN"]
          app_id = os.environ["APP_ID"]
          new_tag = os.environ["NEW_TAG"]
          app_repo = os.environ["APP_REPO"]
          branch = os.environ["BRANCH"]
          title = f"chore(sync): {app_id} -> {new_tag}"
          body = f"Automated sync from {app_repo}@{new_tag} via app-release.yml."
          api = "https://api.github.com"

          def request(method, path, payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(
                  f"{api}{path}",
                  data=data,
                  method=method,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "Content-Type": "application/json",
                  },
              )
              with urllib.request.urlopen(req) as response:
                  body = response.read()
                  return json.loads(body) if body else None

          head = urllib.parse.quote(f"tekflox:{branch}", safe="")
          prs = request("GET", f"/repos/tekflox/aw-marketplace/pulls?state=open&head={head}")
          if prs:
              pr = request("PATCH", f"/repos/tekflox/aw-marketplace/pulls/{prs[0]['number']}", {
                  "title": title,
                  "body": body,
              })
          else:
              pr = request("POST", "/repos/tekflox/aw-marketplace/pulls", {
                  "title": title,
                  "body": body,
                  "base": "master",
                  "head": branch,
              })
          print(f"pr_number={pr['number']}")
          PY

      - name: Auto-merge first-party TekFlox sync PRs
        if: ${{ steps.sync.outputs.changed == 'true' && startsWith(github.repository, 'tekflox/') }}
        env:
          GH_TOKEN: ${{ secrets.MARKETPLACE_SYNC_TOKEN }}
        run: |
          set -euo pipefail
          APP_ID=$(python3 -c "import json;print(json.load(open('aw-app.json'))['id'])")
          BRANCH="sync/${APP_ID}"
          export BRANCH
          python3 - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request
          import urllib.error

          token = os.environ["GH_TOKEN"]
          branch = os.environ["BRANCH"]
          api = "https://api.github.com"
          graphql = "https://api.github.com/graphql"

          def request(method, path, payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(
                  f"{api}{path}",
                  data=data,
                  method=method,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "Content-Type": "application/json",
                  },
              )
              with urllib.request.urlopen(req) as response:
                  body = response.read()
                  return json.loads(body) if body else None

          def graphql_request(query, variables):
              req = urllib.request.Request(
                  graphql,
                  data=json.dumps({"query": query, "variables": variables}).encode(),
                  method="POST",
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "Content-Type": "application/json",
                  },
              )
              with urllib.request.urlopen(req) as response:
                  payload = json.load(response)
              if payload.get("errors"):
                  raise RuntimeError(payload["errors"])
              return payload["data"]

          head = urllib.parse.quote(f"tekflox:{branch}", safe="")
          prs = request("GET", f"/repos/tekflox/aw-marketplace/pulls?state=open&head={head}")
          if not prs:
              raise SystemExit(f"No open PR found for {branch}")
          pr = prs[0]

          # First-party app repos may queue their marketplace sync PR for
          # auto-merge. If auto-merge is unavailable because the PR is already
          # mergeable, fall back to an immediate squash merge.
          try:
              graphql_request(
                  """
                  mutation($pullRequestId: ID!) {
                    enablePullRequestAutoMerge(input: {
                      pullRequestId: $pullRequestId,
                      mergeMethod: SQUASH
                    }) { pullRequest { number } }
                  }
                  """,
                  {"pullRequestId": pr["node_id"]},
              )
              print(f"auto_merge_enabled=true pr_number={pr['number']}")
          except Exception as exc:
              print(f"auto_merge_unavailable={exc}; attempting immediate squash merge")
              request("PUT", f"/repos/tekflox/aw-marketplace/pulls/{pr['number']}/merge", {
                  "merge_method": "squash",
              })
              print(f"merged=true pr_number={pr['number']}")
          PY
