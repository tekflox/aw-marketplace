name: App release (reusable)

# Called by a ~10-line caller workflow in each aw-app-* repo via:
#   jobs:
#     release:
#       uses: tekflox/aw-marketplace/.github/workflows/app-release.yml@v1
#       secrets: inherit
#
# Referenced by a MOVING tag (@v1) or @main so bumping this workflow
# propagates to every caller's next run without touching their repos.
on:
  workflow_call:
    inputs:
      bump:
        description: "Force a bump kind (only 'major' is meaningful here)."
        type: string
        required: false
        default: ""
      catalog_repo:
        description: >-
          Catalog repo to sync the entry into. Defaults to the PUBLIC
          tekflox/aw-marketplace; a private app passes
          tekflox/aw-marketplace-private. Only the catalog's apps.json comes
          from here — the sync/bump scripts and the schema always come from
          tekflox/aw-marketplace, so a private catalog carries nothing but
          its own apps.json.
        type: string
        required: false
        default: "tekflox/aw-marketplace"
    secrets:
      MARKETPLACE_SYNC_TOKEN:
        description: "PAT (repo scope) used to push/PR into the catalog repo."
        required: true

jobs:
  release:
    if: ${{ !contains(github.event.head_commit.message, '[skip release]') }}
    runs-on: [self-hosted, aw-baremetal]
    permissions:
      contents: write
    env:
      CATALOG_REPO: ${{ inputs.catalog_repo }}
    steps:
      # A private app repo must never sync into the PUBLIC catalog. This is
      # not hypothetical: aw-app-crispal (a private store's WordPress, its DB
      # credentials and its MCP surface) called this workflow with no way to
      # say otherwise, and the only thing that kept it out of the public
      # catalog was the caller repo missing MARKETPLACE_SYNC_TOKEN — i.e. an
      # accident. Granting that secret was all it would have taken, and one
      # migration pass in Aug 2026 did exactly that. Derive the answer from
      # the repo's own visibility so it cannot drift out of sync with a
      # forgotten input.
      #
      # Deliberately a run step, not an `if:` guard. `github.event.repository`
      # is only populated for some trigger types, and an expression that
      # evaluates to null skips the step — a guard that silently does not run
      # is worse than no guard, since it reads as "checked, fine". This asks
      # the API and fails closed when the answer is anything but a clear "the
      # app repo is public".
      - name: Refuse to publish a private app to the public catalog
        env:
          GH_TOKEN: ${{ secrets.MARKETPLACE_SYNC_TOKEN }}
          APP_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "$CATALOG_REPO" != "tekflox/aw-marketplace" ]; then
            echo "Target is ${CATALOG_REPO} (not the public catalog) — nothing to check."
            exit 0
          fi
          VISIBILITY=$(curl -fsS \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${APP_REPO}" \
            | python3 -c "import json,sys;print(json.load(sys.stdin).get('private'))")
          if [ "$VISIBILITY" != "False" ]; then
            echo "::error::${APP_REPO} is private (or its visibility could not be" \
                 "determined: '${VISIBILITY}') and this release targets the PUBLIC" \
                 "catalog. Pass catalog_repo: tekflox/aw-marketplace-private."
            exit 1
          fi
          echo "${APP_REPO} is public — publishing to the public catalog is fine."

      - name: Checkout app repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.MARKETPLACE_SYNC_TOKEN }}

      - name: Checkout aw-marketplace scripts + schema
        uses: actions/checkout@v4
        with:
          repository: tekflox/aw-marketplace
          path: _marketplace
          token: ${{ secrets.MARKETPLACE_SYNC_TOKEN }}

      # Separate from _marketplace even when they are the same repo: the
      # catalog is the thing this run COMMITS to, the scripts are what it
      # runs, and conflating them is what made the target un-overridable.
      - name: Checkout the target catalog
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.catalog_repo }}
          path: _catalog
          token: ${{ secrets.MARKETPLACE_SYNC_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run app tests (must pass before any bump/tag/marketplace sync)
        run: |
          set -euo pipefail
          # Common baseline every aw-app-* repo's test suite needs (manifest
          # validation + FastAPI TestClient-based route tests) — apps that
          # need more (e.g. a real playwright browser) lazy-import it inside
          # the function under test, not at module scope, so it's fine for
          # those tests to stay mocked/unexercised here without the extra dep.
          # A real, load-bearing dependency actually under test (e.g. an app
          # that exercises `cryptography` directly, not just at import time)
          # can't be lazy-imported away — such an app declares it in its own
          # requirements-dev.txt, installed here if present.
          pip install -q pytest jsonschema fastapi httpx uvicorn
          if [ -f requirements-dev.txt ]; then
            pip install -q -r requirements-dev.txt
          fi
          if [ -f tests/validate_manifest.py ]; then
            python3 tests/validate_manifest.py
          fi
          if compgen -G "tests/test_*.py" > /dev/null; then
            python3 -m pytest tests/ -q
          fi

      - name: Determine bump kind + new version
        id: bump
        env:
          MANUAL_BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          CURRENT_VERSION=$(python3 -c "import json;print(json.load(open('aw-app.json'))['version'])")
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$LAST_TAG" ]; then
            git log "${LAST_TAG}..HEAD" --format=%s > /tmp/commit_subjects.txt
          else
            git log --format=%s > /tmp/commit_subjects.txt
          fi

          MANUAL_FLAG=""
          if [ "$MANUAL_BUMP" = "major" ] || grep -qi '\[major\]' /tmp/commit_subjects.txt; then
            MANUAL_FLAG="--manual-bump major"
          fi

          NEW_VERSION=$(python3 _marketplace/scripts/bump_version.py "$CURRENT_VERSION" \
            --commit-subjects-file /tmp/commit_subjects.txt $MANUAL_FLAG)
          echo "current_version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "new_tag=v$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Bump aw-app.json, tag, and push release branch
        id: release
        env:
          NEW_VERSION: ${{ steps.bump.outputs.new_version }}
          NEW_TAG: ${{ steps.bump.outputs.new_tag }}
        run: |
          set -euo pipefail
          python3 -c "
          import json
          p = 'aw-app.json'
          data = json.load(open(p))
          data['version'] = '$NEW_VERSION'
          json.dump(data, open(p, 'w'), indent=2)
          open(p, 'a').write('\n')
          "
          git config user.name "aw-marketplace-sync[bot]"
          git config user.email "aw-marketplace-sync@tekflox.com"
          git add aw-app.json
          git commit -m "chore(release): bump to $NEW_TAG [skip release]"
          git tag "$NEW_TAG"
          git branch "release/$NEW_TAG"
          git push origin HEAD:"${GITHUB_REF_NAME}"
          git push origin "$NEW_TAG"
          git push origin "release/$NEW_TAG"

      - name: Sync marketplace catalog entry
        id: sync
        env:
          GH_TOKEN: ${{ secrets.MARKETPLACE_SYNC_TOKEN }}
          NEW_TAG: ${{ steps.bump.outputs.new_tag }}
          APP_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cd _catalog
          APP_ID=$(python3 -c "import json;print(json.load(open('../aw-app.json'))['id'])")
          BRANCH="sync/${APP_ID}"

          git config user.name "aw-marketplace-sync[bot]"
          git config user.email "aw-marketplace-sync@tekflox.com"

          # Idempotent PR, clean branch history: always rebuild the sync branch
          # from current master. Reusing squash-merged sync branches preserves
          # old commits in the PR commit list even when the diff is clean.
          #
          # REMOTE_SHA records the branch's real current tip (empty if it
          # doesn't exist remotely yet, e.g. a closed-without-merge PR or a
          # first-ever sync) so the force-with-lease push below can state an
          # explicit expected value. Bare `--force-with-lease` (auto-detected
          # from refs/remotes/origin/$BRANCH) was tried first but proved
          # unreliable here even when that ref was freshly fetched and
          # correct — it rejected every push with "stale info" regardless,
          # which silently stalled the "git" app's catalog entry at v0.2.0
          # for months. An explicit `--force-with-lease=$BRANCH:$REMOTE_SHA`
          # verified reliable in testing and still rejects a genuine
          # concurrent race (someone else pushing to $BRANCH mid-run).
          git fetch origin master
          REMOTE_SHA=$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)
          git checkout -B "$BRANCH" origin/master

          set +e
          python3 ../_marketplace/scripts/sync_catalog_entry.py \
            ../aw-app.json apps.json "$NEW_TAG" --write
          CHANGED=$?
          set -e

          if [ "$CHANGED" -ne 0 ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

          # Fail BEFORE pushing/opening a PR if the synced entry doesn't
          # satisfy the catalog schema — sync_catalog_entry.py copies fields
          # from the app's own aw-app.json verbatim (e.g. resource_estimate),
          # which has no reason to already match apps.json's stricter schema
          # (see 2026-07-31: mcp-gateway's disk field "~200 MB (prebuilt
          # image)" merged despite failing validate-apps-json, because the
          # only enforcement was a downstream PR check nobody was required to
          # wait for). Catching it here fails the release job itself instead
          # of landing an invalid entry as an open (or worse, merged) PR.
          pip install -q jsonschema
          python3 ../_marketplace/tests/validate_apps.py apps.json

          git add apps.json
          git commit -m "chore(sync): ${APP_ID} -> ${NEW_TAG}"
          if [ -n "$REMOTE_SHA" ]; then
            git push -u origin "$BRANCH" --force-with-lease="$BRANCH:$REMOTE_SHA"
          else
            git push -u origin "$BRANCH" --force-with-lease="$BRANCH"
          fi
          export APP_ID BRANCH

          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          token = os.environ["GH_TOKEN"]
          app_id = os.environ["APP_ID"]
          new_tag = os.environ["NEW_TAG"]
          app_repo = os.environ["APP_REPO"]
          branch = os.environ["BRANCH"]
          catalog_repo = os.environ["CATALOG_REPO"]
          catalog_owner = catalog_repo.split("/", 1)[0]
          title = f"chore(sync): {app_id} -> {new_tag}"
          body = f"Automated sync from {app_repo}@{new_tag} via app-release.yml."
          api = "https://api.github.com"

          def request(method, path, payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(
                  f"{api}{path}",
                  data=data,
                  method=method,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "Content-Type": "application/json",
                  },
              )
              with urllib.request.urlopen(req) as response:
                  body = response.read()
                  return json.loads(body) if body else None

          head = urllib.parse.quote(f"{catalog_owner}:{branch}", safe="")
          prs = request("GET", f"/repos/{catalog_repo}/pulls?state=open&head={head}")
          if prs:
              pr = request("PATCH", f"/repos/{catalog_repo}/pulls/{prs[0]['number']}", {
                  "title": title,
                  "body": body,
              })
          else:
              pr = request("POST", f"/repos/{catalog_repo}/pulls", {
                  "title": title,
                  "body": body,
                  "base": "master",
                  "head": branch,
              })
          print(f"pr_number={pr['number']}")
          PY

      - name: Auto-merge first-party TekFlox sync PRs
        if: ${{ steps.sync.outputs.changed == 'true' && startsWith(github.repository, 'tekflox/') }}
        env:
          GH_TOKEN: ${{ secrets.MARKETPLACE_SYNC_TOKEN }}
        run: |
          set -euo pipefail
          APP_ID=$(python3 -c "import json;print(json.load(open('aw-app.json'))['id'])")
          BRANCH="sync/${APP_ID}"
          export BRANCH
          python3 - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request
          import urllib.error

          token = os.environ["GH_TOKEN"]
          branch = os.environ["BRANCH"]
          catalog_repo = os.environ["CATALOG_REPO"]
          catalog_owner = catalog_repo.split("/", 1)[0]
          api = "https://api.github.com"
          graphql = "https://api.github.com/graphql"

          def request(method, path, payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(
                  f"{api}{path}",
                  data=data,
                  method=method,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "Content-Type": "application/json",
                  },
              )
              with urllib.request.urlopen(req) as response:
                  body = response.read()
                  return json.loads(body) if body else None

          def graphql_request(query, variables):
              req = urllib.request.Request(
                  graphql,
                  data=json.dumps({"query": query, "variables": variables}).encode(),
                  method="POST",
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "Content-Type": "application/json",
                  },
              )
              with urllib.request.urlopen(req) as response:
                  payload = json.load(response)
              if payload.get("errors"):
                  raise RuntimeError(payload["errors"])
              return payload["data"]

          head = urllib.parse.quote(f"{catalog_owner}:{branch}", safe="")
          prs = request("GET", f"/repos/{catalog_repo}/pulls?state=open&head={head}")
          if not prs:
              raise SystemExit(f"No open PR found for {branch}")
          pr = prs[0]

          # First-party app repos may queue their marketplace sync PR for
          # auto-merge. If auto-merge is unavailable because the PR is already
          # mergeable, fall back to an immediate squash merge.
          try:
              graphql_request(
                  """
                  mutation($pullRequestId: ID!) {
                    enablePullRequestAutoMerge(input: {
                      pullRequestId: $pullRequestId,
                      mergeMethod: SQUASH
                    }) { pullRequest { number } }
                  }
                  """,
                  {"pullRequestId": pr["node_id"]},
              )
              print(f"auto_merge_enabled=true pr_number={pr['number']}")
          except Exception as exc:
              print(f"auto_merge_unavailable={exc}; attempting immediate squash merge")
              request("PUT", f"/repos/{catalog_repo}/pulls/{pr['number']}/merge", {
                  "merge_method": "squash",
              })
              print(f"merged=true pr_number={pr['number']}")
          PY
