name: Validate

on:
  pull_request:
    branches: [master]

jobs:
  validate-apps-json:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install jsonschema pytest
      - run: python3 tests/validate_apps.py
      - run: python3 -m pytest tests/ -q
